<title>antiloki Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Geist:wght@400;500;600&display=swap">
<style>
  :root { --bg:#221f1c; --panel:#2a2622; --panel2:#332e29; --border:#3b3631; --fg:#efe9e2; --dim:#a89f96; --muted:#7a716a; --brand:#c97c5c; --brand-soft:rgba(201,124,92,.14); --ok:#7fc48f; --warn:#d9b45a; --bad:#d9705a; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --nav:"Geist",-apple-system,system-ui,sans-serif; color-scheme:dark; }

  .banner b { color:var(--brand); font-weight:600; } .banner a { color:var(--fg); text-decoration:none; border:1px solid var(--border); border-radius:6px; padding:2px 8px; } .banner a:hover { border-color:var(--brand); }
  /* sidebar */

  .cat { margin-bottom:6px; }
  .cat > .h { display:flex; align-items:center; gap:6px; padding:6px 14px 4px; color:var(--muted); font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; cursor:pointer; user-select:none; }
  .cat > .h .tri { width:10px; display:inline-block; transition:transform .2s ease; font-size:8px; } .cat.closed > .h .tri { transform:rotate(-90deg); }
  .cat > .h .name:hover { color:var(--dim); }

  .cat .body > div { overflow:hidden; min-height:0; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 14px; cursor:pointer; border-left:2px solid transparent; color:var(--muted); white-space:nowrap; }
  .row:hover { background:var(--panel); color:var(--dim); }
  .row.active { color:var(--fg); }
  .row.shown { border-left-color:var(--brand); background:var(--panel); }
  .row .g { width:12px; text-align:center; font-size:10px; color:var(--dim); } .row.active .g { color:var(--brand); }

  .newcat { margin:10px 14px 0; border:1px dashed var(--border); border-radius:7px; padding:6px 10px; color:var(--muted); font-size:10.5px; cursor:pointer; } .newcat:hover { color:var(--dim); border-color:var(--dim); }
  /* stage */

  .pill { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:60; display:flex; gap:2px; padding:2px; border-radius:9px; background:color-mix(in oklab,var(--panel) 78%,transparent); border:1px solid var(--border); backdrop-filter:blur(8px); font-family:var(--nav); font-size:11px; }
  .pill button { padding:3px 11px; border-radius:7px; color:var(--dim); } .pill button.on { background:var(--brand-soft); color:var(--brand); font-weight:600; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; } .chips .chip { padding:2px 8px; font-size:10px; border-radius:5px; }

  .tree .ind { padding-left:20px; }
  .primary { background:var(--brand); color:#1d1410; font-weight:700; border-radius:6px; padding:6px 16px; } .primary:disabled { background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:400; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:9.5px; }

  <main class="stage">

  "src/App.tsx": `import { useEffect, useState } from "react";\nimport { products, formatPrice, type Product } from "./products";\nimport { useCart } from "./cart";\n\nfunction ProductCard({ product, onAdd, index }: { product: Product; onAdd: () => void; index: number }) {\n  const [pulse, setPulse] = useState(false);\n  const add = () => {\n    onAdd();\n    setPulse(true);\n    setTimeout(() => setPulse(false), 400);\n  };\n  return (\n    <article className="card" style={{ animationDelay: \`\${index * 70}ms\` }}>\n      <div className="swatch" style={{ background: \`hsl(\${product.hue} 40% 82%)\` }} />\n      <div className="card-body">\n        <span className="tag">{product.tag}</span>\n        <h3>{product.name}</h3>\n        <div className="row">\n          <span className="price">{formatPrice(product.price)}</span>\n          <button className={\`add \${pulse ? "pulse" : ""}\`} onClick={add}>+</button>\n        </div>\n      </div>\n    </article>\n  );\n}`,
  "src/cart.ts": `import { useCallback, useMemo, useState } from "react";\nimport { products, type Product } from "./products";\n\nexport type CartLine = { product: Product; qty: number };\n\nexport function useCart() {\n  const [lines, setLines] = useState<Record<string, number>>({});\n\n  const add = useCallback((id: string) => {\n    setLines((l) => ({ ...l, [id]: (l[id] ?? 0) + 1 }));\n  }, []);\n\n  const remove = useCallback((id: string) => {\n    setLines((l) => {\n      const next = { ...l };\n      if ((next[id] ?? 0) <= 1) delete next[id];\n      else next[id] -= 1;\n      return next;\n    });\n  }, []);\n\n  const clear = useCallback(() => setLines({}), []);\n\n  const items = useMemo<CartLine[]>(\n    () => Object.entries(lines).map(([id, qty]) => ({ product: products.find((p) => p.id === id)!, qty })).filter((l) => l.product),\n    [lines],\n  );\n  const count = items.reduce((n, l) => n + l.qty, 0);\n  const total = items.reduce((n, l) => n + l.qty * l.product.price, 0);\n  return { items, count, total, add, remove, clear };\n}`,

function setDiff(it, f) { S.lastDiff = `<div class="diff"><div class="hint" style="margin-bottom:8px">${NAMES[it.engine][1]} · wt/${it.id} · ${f} · +18 −3 · <span style="color:var(--ok)">no overlap with other worktrees</span></div><pre><span class="h">@@ -18,7 +18,22 @@ function ProductCard</span>\n<span class="r">-        &lt;button className="add" onClick={add}&gt;+&lt;/button&gt;</span>\n<span class="a">+        &lt;div className="qty"&gt;</span>\n<span class="a">+          &lt;button className="ghost" onClick={() =&gt; cart.remove(product.id)} aria-label="less"&gt;−&lt;/button&gt;</span>\n<span class="a">+          &lt;b&gt;{qty}&lt;/b&gt;</span>\n<span class="a">+          &lt;button className="ghost" onClick={add} aria-label="more"&gt;+&lt;/button&gt;</span>\n<span class="a">+        &lt;/div&gt;</span>\n<span class="h">@@ tests/cart.test.ts (new)</span>\n<span class="a">+  it("steps quantity up and down", () =&gt; { … })</span></pre></div>`; for (const b of Object.values(bodies)) if (b.dataset.role === "diff") b.innerHTML = S.lastDiff; }

// ─────────────────────────────────────────────────────────────────────────────────────────────
// ghosts: fuel + timeline previews → focused windows
function renderGhosts() {
  const f = S.fuel; const fmt = (n) => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n);
  $("#fuelG").innerHTML = `<div class="l">claude — <b>${f.claude.on || f.claude.tok ? fmt(f.claude.tok) + " tok · $" + f.claude.usd.toFixed(2) : "tok · $ —"}</b> · 5h ${f.claude.h5}% · wk ${f.claude.wk}%<span class="dot ${f.claude.on ? "on" : ""}"></span></div><div class="l">codex ${f.codex.on ? `<b>${fmt(f.codex.tok)} tok · $${f.codex.usd.toFixed(2)}</b>` : "not running"}<span class="dot ${f.codex.on ? "on" : ""}"></span></div><div>opencode ${f.opencode.on ? `<b>${fmt(f.opencode.tok)} tok · $${f.opencode.usd.toFixed(2)}</b>` : "not running"}<span class="dot ${f.opencode.on ? "on" : ""}"></span></div><div>fuel <span class="more">···</span></div>`;
  const tl = S.timeline.slice(0, 3); const agents = S.items.filter((i) => i.kind === "agent").length;
  $("#tlG").innerHTML = (tl.length ? tl.map((e) => `<div><span class="t">${e.ts}</span><b>${esc(e.kind)} ${esc(e.label)}</b><span class="dot ${e.who === "you" ? "" : "on"}"></span></div>`).join("") : `<div>timeline — nothing yet</div>`) + `<div>${agents} agent${agents === 1 ? "" : "s"} <span class="more">···</span></div>`;
}
$("#fuelG").onclick = () => { const f = S.fuel; window_(`fuel`, `tokens · cost · limits`, `<div class="fuel">${Object.entries(NAMES).map(([k, [g, n, who]]) => `<div class="eng"><h4>${g} ${n}<span class="st">${f[who].on ? "running" : "not running"}</span></h4><div class="kv"><div>tokens<b>${f[who].tok.toLocaleString()}</b></div><div>cost<b>$${f[who].usd.toFixed(2)}</b></div><div>session<b>${f[who].on ? "live" : "—"}</b></div><div>model<b>${who === "claude" ? "opus" : who === "codex" ? "gpt-5" : "—"}</b></div></div><div class="lim"><span>5-hour</span><div class="bar"><i style="width:${f[who].h5}%"></i></div><span>${f[who].h5}%</span></div><div class="lim"><span>weekly</span><div class="bar"><i style="width:${f[who].wk}%"></i></div><span>${f[who].wk}%</span></div></div>`).join("")}</div>`, 720); };
$("#tlG").onclick = () => { const color = (w) => w === "you" ? "var(--dim)" : w === "claude" ? "var(--brand)" : w === "codex" ? "#7fb7e6" : "#8fd0c0"; let filter = "all"; const draw = () => { const rows = S.timeline.filter((e) => filter === "all" || e.who === filter); $("#modal .wb").innerHTML = `<div class="tl"><div class="filters">${["all", "you", "claude", "codex", "opencode"].map((w) => `<button class="chip ${filter === w ? "on" : ""}" data-w="${w}">${w}</button>`).join("")}</div>${rows.length ? rows.map((e) => `<div class="lane"><span class="ts">${e.ts}</span><span class="dt" style="background:${color(e.who)}"></span><span><b style="color:var(--fg)">${esc(e.kind)}</b> ${esc(e.label)}</span><span class="who">${e.who}</span></div>`).join("") : `<div class="empty">nothing yet — open a widget, start an agent</div>`}</div>`; $("#modal .wb").querySelectorAll("[data-w]").forEach((c) => { c.onclick = () => { filter = c.dataset.w; draw(); }; }); }; window_("timeline", "every agent's audit trail · read it like a stack trace", "", 860); draw(); };
function window_(title, sub, html, w) { const m = $("#modal"); m.innerHTML = `<div class="modal"><div class="win" style="width:min(${w}px,94vw);height:min(80vh,680px)"><div class="wh"><b>${esc(title)}</b><span class="sub">${esc(sub)}</span><span class="sp"></span><button class="x">✕</button></div><div class="wb">${html}</div></div></div>`; m.querySelector(".x").onclick = () => { m.innerHTML = ""; }; m.querySelector(".modal").onclick = (e) => { if (e.target.classList.contains("modal")) m.innerHTML = ""; }; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#modal").innerHTML = ""; });

// ─────────────────────────────────────────────────────────────────────────────────────────────
// stage
function cellHeader(it, inSplit) { return `<div class="hd"><span class="g">◆</span><span class="name" title="double-click to rename">${esc(it.label)}</span>${it.uid ? `<span class="uid">#${it.uid}</span>` : ""}<span class="sp"></span>${inSplit ? `<button class="rm" title="remove from the split">⊟</button>` : ""}${it.obligatory ? "" : `<button class="cl" title="close">✕</button>`}</div>`; }
function renderStage() {
  const threads = S.view === "threads"; $("#scroll").hidden = !threads; $("#blocks").hidden = threads;
  if (threads) {
    const shown = S.shown.map((id) => S.items.find((i) => i.id === id)).filter(Boolean); const { cols, rows, spans } = layout(shown.length);
    const grid = $("#grid"); grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`; grid.style.gridTemplateRows = `repeat(${rows}, minmax(0,1fr))`; const sc = $("#scroll"); if (rows > 2) { grid.style.flex = "0 0 auto"; grid.style.height = `${Math.round(sc.clientHeight * rows / 2)}px`; sc.style.overflowY = "auto"; } else { grid.style.flex = "1 1 0"; grid.style.height = ""; sc.style.overflowY = "hidden"; }
    grid.innerHTML = ""; shown.forEach((it, i) => { const c = el(`<div class="cell" style="grid-column:span ${spans[i][0]};grid-row:span ${spans[i][1]}">${cellHeader(it, shown.length > 1)}</div>`); c.appendChild(body(it)); c.querySelector(".rm")?.addEventListener("click", () => toggleShown(it.id)); c.querySelector(".cl")?.addEventListener("click", () => closeItem(it.id)); c.querySelector(".name").ondblclick = () => { const v = prompt("rename", it.label); if (v) { it.label = v; render(); } }; grid.appendChild(c); });
  } else {
    const items = S.items.filter((i) => i.id !== "chat"); const b = $("#blocks"); b.innerHTML = "";
    if (!items.length) b.innerHTML = `<div class="empty">Blocks view — every widget as a tile, rows of ten<br><span class="hint">add widgets from the sidebar, or switch to Threads</span></div>`;
    for (let r = 0; r < items.length; r += 10) { const row = el(`<div class="rowb"></div>`); for (const it of items.slice(r, r + 10)) { const t = el(`<div class="tile">${cellHeader(it, false)}</div>`); t.appendChild(body(it)); t.querySelector(".cl")?.addEventListener("click", () => closeItem(it.id)); row.appendChild(t); } b.appendChild(row); }
  }
}
function render() { renderSide(); renderStage(); renderGhosts(); }
addEventListener("resize", () => renderStage());
$("#vBlocks").onclick = () => { S.view = "blocks"; $("#vBlocks").classList.add("on"); $("#vThreads").classList.remove("on"); render(); };
$("#vThreads").onclick = () => { S.view = "threads"; $("#vThreads").classList.add("on"); $("#vBlocks").classList.remove("on"); render(); };

// a warm start: two tools open so the first frame shows the desk, not an empty room
addItem("terminal", "Terminal", "tools"); addItem("code", "Code", "codebase", { path: "src/cart.ts" }); S.shown = [S.items[1].id, S.items[2].id]; render();
setTimeout(() => toast("click + under agents to start one — watch the gate, the goal run and the timeline"), 1200);
</script>
